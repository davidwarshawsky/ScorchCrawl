# =============================================================================
# ScorchCrawl — Pre-built images from Docker Hub (no build required)
#
# Deploy with: docker compose -f docker-compose.hub.yaml up -d
#
# Images published at: https://hub.docker.com/u/ananymoususer
# =============================================================================

name: scorchcrawl

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_URL:-redis://redis:6379}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright:3000/scrape}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-5}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-3}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-3}
  SCRAPE_MAX_ATTEMPTS: ${SCRAPE_MAX_ATTEMPTS:-3}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  PROXY_SERVER: ${PROXY_SERVER:-}
  PROXY_USERNAME: ${PROXY_USERNAME:-}
  PROXY_PASSWORD: ${PROXY_PASSWORD:-}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT:-http://searxng:8080}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LOGGING_LEVEL: ${LOGGING_LEVEL:-info}

services:
  scorchcrawl-api:
    image: ananymoususer/scorchcrawl:latest
    container_name: scorchcrawl-api
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      ENV: local
    depends_on:
      redis: { condition: service_started }
      playwright: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      searxng: { condition: service_healthy }
    ports:
      - "${SCORCHCRAWL_HOST:-127.0.0.1}:${SCORCHCRAWL_PORT:-24786}:${INTERNAL_PORT:-3002}"
    command: node dist/src/harness.js --start-docker
    networks: [backend]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1536M
    memswap_limit: 1536M

  searxng:
    image: searxng/searxng:latest
    networks: [backend]
    restart: unless-stopped
    volumes:
      - ./engine/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128M
    memswap_limit: 128M

  playwright:
    image: ananymoususer/scorchcrawl-playwright:latest
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      BLOCK_MEDIA: ${BLOCK_MEDIA:-}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-3}
    networks: [backend]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768M
    memswap_limit: 768M

  browserless:
    image: browserless/chrome:latest
    environment:
      DEFAULT_STEALTH: "true"
      MAX_CONCURRENT_SESSIONS: ${BROWSER_POOL_SIZE:-3}
      CONNECTION_TIMEOUT: "60000"
      TOKEN: ${BROWSERLESS_TOKEN:-scorchcrawl-stealth-token}
    networks: [backend]
    restart: unless-stopped
    mem_limit: 768M
    memswap_limit: 768M

  redis:
    image: redis:alpine
    networks: [backend]
    command: redis-server --bind 0.0.0.0
    restart: unless-stopped
    mem_limit: 128M
    memswap_limit: 128M

  rabbitmq:
    image: rabbitmq:3-management
    networks: [backend]
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    mem_limit: 256M
    memswap_limit: 256M

  postgres:
    image: ananymoususer/scorchcrawl-postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks: [backend]
    restart: unless-stopped
    mem_limit: 384M
    memswap_limit: 384M

networks:
  backend:
    driver: bridge
